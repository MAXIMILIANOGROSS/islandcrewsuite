function V(x,y,z){return new THREE.Vector3(x,y,z)}
construir();
/* ---------- utilidades ---------- */
const S={sens:1,suav:.55,cara:true,cuerpo:true,manos:true,iy:false,ip:false,ir:false};
const lam=()=>28-24*S.suav,BETA=8,MAXSTEP=.5;

let blink={L:0,R:0},gz={x:0,y:0},cuerpoUlt=0,caraUlt=0;
function aplicarCara(dt){
 const b=T.bs,m=T.face;if(!m)return;

const sc=p=>V(-p.x,-p.y,-p.z);
function aplicarCuerpo(dt){
 const W=T.pose;if(!W)return;const P=i=>sc(W[i]);const ls=P(11),rs=P(12);
 const v=rs.clone().sub(ls);let rol=Math.atan2(v.y,v.x),yaw=Math.atan2(-v.z,v.x),lean=0;

function paraDemo(dt){td+=dt;const t=td;
