<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Island Crew Marketing Suite</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14100b;color:#f3ead9;font:16px/1.5 Georgia,serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.c{width:min(680px,94vw);background:#1d1710;border:1px solid #d4a94f55;border-radius:16px;padding:28px 30px}
h1{font-size:22px;margin:0 0 4px;color:#e2bd68}h2{font-size:19px;margin:18px 0 6px}small,.n{color:#b9a98a}p{margin:8px 0}
.b{height:6px;background:#2d2418;border-radius:4px;margin:14px 0 6px}.b i{display:block;height:100%;background:linear-gradient(#e2bd68,#c4983f);border-radius:4px;transition:width .3s}
input[type=text],input[type=password],textarea,select{width:100%;padding:11px 12px;margin:6px 0;background:#120d08;color:#f3ead9;border:1px solid #d4a94f55;border-radius:8px;font:inherit}
textarea{min-height:92px}label{display:block;margin:6px 0}
button{padding:11px 20px;border-radius:9px;border:1px solid #d4a94f;background:#2a1c0c;color:#e2bd68;font:inherit;cursor:pointer}
button.p{background:linear-gradient(#e2bd68,#c4983f);color:#2a1c0c;border-color:#e2bd68;font-weight:bold}button:disabled{opacity:.45;cursor:default}
.r{display:flex;justify-content:space-between;margin-top:20px;gap:10px}.ok{color:#8fd694}.er{color:#ff8a7a}.x{opacity:.55}
a{color:#e2bd68}ol{padding-left:20px}
</style></head><body><div class="c"><h1>Island Crew Marketing Suite</h1><small id="sub">Asistente de instalación</small>
<div class="b"><i id="bar" style="width:0"></i></div><div class="n" id="paso"></div><div id="cuerpo"></div>
<div class="r"><button id="atras">Atrás</button><button class="p" id="sig">Siguiente</button></div></div>
<script>
var E={},D={fabricas:["carta"],datos:"",licencia:"",negocio:"",ciudad:"",idioma:"es",gemini:"",groq:"",publicacion:"cloudflare",acepta:false},i=0,msg="";
var $=function(x){return document.getElementById(x)};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
document.addEventListener("click",function(e){var id=e.target.id;
if(id=="lp"){(navigator.clipboard&&navigator.clipboard.readText?navigator.clipboard.readText():Promise.reject()).then(function(x){$("lic").value=x.replace(/\s+/g,"");$("lm").textContent="Licencia pegada. Pulsa Siguiente."}).catch(function(){$("lm").textContent="El navegador no deja pegar con el botón. Haz clic en la caja y pulsa Cmd+V (Mac) o Ctrl+V (Windows)."})}
if(id=="la"){$("lf").click()}});
document.addEventListener("change",function(e){if(e.target.id=="lf"){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$("lic").value=String(r.result).replace(/\s+/g,"");$("lm").textContent="Licencia cargada desde el archivo. Pulsa Siguiente."};r.readAsText(f)}});
function post(u,b){return fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b||{})}).then(function(r){return r.json()})}
var P=[
{t:"1 · ¿Qué fábricas quieres instalar?",h:function(){return '<label><input type="checkbox" checked disabled> <b>Carta Viva</b> · carta del restaurante con un vídeo por plato</label><label><input type="checkbox" checked disabled> <b>Publicaciones y calendario</b> · tu mes de publicaciones y el paquete diario listo para subir</label><label><input type="checkbox" checked disabled> <b>Anuncios</b> · publicidad de tus platos en todos los formatos y en vídeo</label><label class="x"><input type="checkbox" disabled> <b>Música (Cabra Beats)</b> · se activa con tu licencia en equipos que tengan su motor instalado</label><p class="n">Cada fábrica se activa según tu licencia.</p>'},ok:function(){return true}},
{t:"2 · ¿Dónde guardamos tus datos?",h:function(){return '<p>Tus cartas, fotos y vídeos se quedan en este ordenador, nunca en nuestros servidores.</p><input type="text" id="datos" value="'+esc(D.datos||E.datos_defecto)+'"><p class="n">Puedes escribir otra carpeta, por ejemplo la de un disco externo. Si no sabes, deja esta.</p>'},g:function(){D.datos=$("datos").value.trim()},ok:function(){return D.datos.length>2||"Escribe una carpeta."}},
{t:"3 · Tu licencia",h:function(){return '<p>Pega aquí el texto de licencia que te dio Island Crew (viene en el pendrive o por correo).</p><textarea id="lic">'+esc(D.licencia)+'</textarea><div class="f"><button id="lp">📋 Pegar licencia copiada</button><button id="la">📂 Abrir archivo de licencia (.txt)</button><input type="file" id="lf" accept=".txt,text/plain" style="display:none"></div><div id="lm"></div>'},g:function(){D.licencia=$("lic").value.replace(/\s+/g,"")},ok:function(){return post("/api/licencia",{licencia:D.licencia}).then(function(r){return r.ok?true:r.mensaje})}},
{t:"4 · Datos de tu negocio",h:function(){return '<input type="text" id="neg" placeholder="Nombre del negocio" value="'+esc(D.negocio)+'"><input type="text" id="ciu" placeholder="Ciudad" value="'+esc(D.ciudad)+'"><select id="idi"><option value="es">Español</option><option value="en">English</option><option value="de">Deutsch</option><option value="it">Italiano</option></select>'},g:function(){D.negocio=$("neg").value.trim();D.ciudad=$("ciu").value.trim();D.idioma=$("idi").value},ok:function(){return D.negocio.length>1||"Escribe el nombre de tu negocio."}},
{t:"5 · Claves gratuitas de inteligencia artificial",h:function(){return '<p>Las usan los textos y traducciones. Son gratis y solo tuyas.</p><ol><li>Entra en <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>, inicia sesión con Google y pulsa «Create API key». Cópiala aquí.</li><li>Opcional, de reserva: <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a>.</li></ol><input type="password" id="gk" placeholder="Clave de Gemini" value="'+esc(D.gemini)+'"><input type="password" id="qk" placeholder="Clave de Groq (opcional)" value="'+esc(D.groq)+'"><button id="pr">Comprobar claves</button><div id="pm"></div><p class="n">Puedes dejarlo en blanco y ponerlo luego, pero sin la clave no habrá traducciones ni textos automáticos.</p>'},g:function(){D.gemini=$("gk").value.trim();D.groq=$("qk").value.trim()},ok:function(){return true},a:function(){$("pr").onclick=function(){D.gemini=$("gk").value.trim();D.groq=$("qk").value.trim();$("pm").innerHTML="Comprobando…";post("/api/claves",{gemini:D.gemini,groq:D.groq}).then(function(r){$("pm").innerHTML=r.map(function(x){return '<div class="'+(x.ok?'ok':'er')+'">'+esc(x.mensaje)+'</div>'}).join("")})}}},
{t:"6 · ¿Cómo vas a publicar tu carta?",h:function(){return '<label><input type="radio" name="pb" value="cloudflare"'+(D.publicacion=="cloudflare"?" checked":"")+'> Con mi cuenta gratuita de Cloudflare Pages (te guiamos paso a paso)</label><label><input type="radio" name="pb" value="carpeta"'+(D.publicacion=="carpeta"?" checked":"")+'> Prefiero recibir la carpeta y subirla yo donde quiera</label><p class="n">En los dos casos la carta se crea en este ordenador.</p>'},g:function(){var r=document.querySelector('input[name=pb]:checked');D.publicacion=r?r.value:"cloudflare"},ok:function(){return true}},
{t:"7 · Comprobación de tu equipo",h:function(){return '<p>Sistema: <b>'+esc(E.sistema_nombre)+'</b></p><p>'+esc(E.musica)+'</p><p><b>Cabra Beats:</b> '+(E.musica_ok?"motor de música detectado en este equipo.":"el motor de música no está instalado en este equipo.")+'</p>'},ok:function(){return true}},
{t:"8 · Condiciones y licencias de uso",h:function(){return '<p>El software, sus plantillas y las piezas que genera son obra de Maximiliano Olmos Sánchez para Island Crew Marketing. Tu licencia te permite usarlo en tu negocio; no puedes revenderlo ni copiarlo. Para otros usos, escribe a hola@islandcrew.es.</p><p>Incluye ffmpeg y otros componentes con sus propias licencias; el detalle está en la carpeta Licencias de la instalación.</p><label><input type="checkbox" id="ac"'+(D.acepta?" checked":"")+'> He leído y acepto las condiciones</label>'},g:function(){D.acepta=$("ac").checked},ok:function(){return D.acepta||"Tienes que aceptar para continuar."}}
];
function pinta(){var p=P[i];$("paso").textContent="Paso "+(i+1)+" de "+P.length;$("bar").style.width=((i+1)/P.length*100)+"%";$("cuerpo").innerHTML="<h2>"+p.t+"</h2>"+p.h()+'<div id="msg" class="er">'+esc(msg)+"</div>";if(p.a)p.a();$("atras").style.visibility=i?"visible":"hidden";$("sig").textContent=i==P.length-1?"Terminar e instalar":"Siguiente"}
$("atras").onclick=function(){var p=P[i];if(p.g)p.g();msg="";i--;pinta()};
$("sig").onclick=function(){var p=P[i];if(p.g)p.g();$("sig").disabled=true;Promise.resolve(p.ok()).then(function(r){$("sig").disabled=false;if(r!==true){msg=r;pinta();return}msg="";
if(i<P.length-1){i++;pinta();return}
$("sig").disabled=true;post("/api/guardar",D).then(function(x){if(x.ok){$("cuerpo").innerHTML='<h2>Todo listo</h2><p class="ok">Abriendo Carta Viva…</p>';$("sig").style.display="none";$("atras").style.display="none"}else{$("sig").disabled=false;msg=x.mensaje;pinta()}})})};
fetch("/api/estado").then(function(r){return r.json()}).then(function(r){E=r;D.datos=r.datos_defecto;D.negocio=r.config.negocio||"";D.ciudad=r.config.ciudad||"";pinta()});
</script></body></html>
