<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conexiones</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d0f14;color:#f1ece2;font:15px/1.5 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:22px}
h1{font-size:22px;margin:0 0 4px}p.s{color:#aab4c4;margin:0 0 16px}.k{background:#151922;border:1px solid #ffffff18;border-top:4px solid var(--c);border-radius:14px;padding:16px;margin:14px 0}
.k h2{margin:0;font-size:18px;color:var(--c)}ol{margin:8px 0 10px 20px;padding:0;color:#cdd4df}input{width:100%;margin:4px 0;padding:8px 10px;border-radius:8px;border:1px solid #ffffff30;background:#0d0f14;color:#f1ece2;font:inherit}
button{padding:8px 14px;border-radius:8px;border:0;background:var(--c);color:#0d0f14;font:inherit;font-weight:bold;cursor:pointer;margin:4px 6px 0 0}button.g{background:#232a38;color:#f1ece2;font-weight:normal}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#556070;margin-right:6px}.dot.on{background:#3ddc97}.m{min-height:22px;color:#cdd4df;margin-top:6px}a{color:var(--c)}details{margin-top:8px}</style></head><body><main>
<button class="g" style="--c:#fff" onclick="location.href='/'">← Volver</button>
<h1>Conexiones</h1><p class="s">Conecta tus redes y tu canal para automatizarlos. Tus claves se guardan solo en este ordenador.</p><div id="r"></div>
<script>
var R=[{id:"meta",c:"#4aa8ff",t:"Instagram y Facebook",f:[["META_FB_PAGE_ID","ID de la página de Facebook"],["META_FB_PAGE_TOKEN","Token de acceso de la página"],["META_IG_USER_ID","ID de la cuenta de Instagram"]],
p:["Pasa tu Instagram a cuenta profesional y enlázala a tu página de Facebook.","Entra en developers.facebook.com, crea una app (gratis) y añade «Instagram Graph API».","En el Explorador de la Graph API genera un token de página con permisos de publicar y copia los dos ID.","Pega los tres datos aquí y pulsa Probar."],u:"https://developers.facebook.com/apps"},
{id:"youtube",c:"#ff4a4a",t:"YouTube",f:[],yt:1,
p:["Entra en console.cloud.google.com, crea un proyecto (gratis) y activa «YouTube Data API v3».","En «Credenciales» crea un «ID de cliente OAuth» de tipo «Aplicación de escritorio» y descarga el JSON.","Abre ese archivo con un editor de texto, copia todo y pégalo en la caja de abajo.","Pulsa «Conectar YouTube», elige tu canal y acepta el permiso. Desde ahí sube sin más pasos."],u:"https://console.cloud.google.com/apis/library/youtube.googleapis.com"}];
function $(x){return document.getElementById(x)}function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function post(o){return fetch("/api/conexiones",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(o)}).then(function(r){return r.json()})}
function pinta(e){$("r").innerHTML=R.map(function(x){var s=e.estado[x.id];return '<div class="k" style="--c:'+x.c+'"><h2><i class="dot'+(s.ok?" on":"")+'"></i>'+x.t+' · <small>'+(s.ok?"Conectado":"Sin conectar")+'</small></h2>'+
'<details'+(s.ok?"":" open")+'><summary>¿No sabes cómo? Cuatro pasos</summary><ol>'+x.p.map(function(p){return "<li>"+p+"</li>"}).join("")+'</ol><a href="'+x.u+'" target="_blank">Abrir página oficial</a></details>'+
(x.yt?'<textarea id="ytj" rows="3" placeholder="Pega aquí el contenido del archivo JSON'+(s.campos["client_secret.json"]?" (ya guardado)":"")+'" style="width:100%;margin:4px 0;padding:8px;border-radius:8px;border:1px solid #ffffff30;background:#0d0f14;color:#f1ece2;font:inherit"></textarea><button data-a="ys" data-r="youtube">Guardar archivo</button><button data-a="yc" data-r="youtube">Conectar YouTube</button>':"")+x.f.map(function(f){return '<input data-r="'+x.id+'" data-c="'+f[0]+'" type="password" placeholder="'+f[1]+(s.campos[f[0]]?" (ya guardado)":"")+'" autocomplete="off">'}).join("")+
'<button data-a="g" data-r="'+x.id+'">Guardar</button><button data-a="p" data-r="'+x.id+'" class="g">Probar</button><button data-a="b" data-r="'+x.id+'" class="g">Desconectar</button>'+(x.id=="meta"&&e.dev?'<button data-a="i" class="g">Usar las de islandcrew.es</button>':"")+'<div class="m" id="m-'+x.id+'"></div></div>'}).join("")}
function carga(){fetch("/api/conexiones").then(function(r){return r.json()}).then(pinta)}
document.addEventListener("click",function(e){var a=e.target.getAttribute("data-a");if(!a)return;var r=e.target.getAttribute("data-r"),m=$("m-"+(r||"meta"));m.textContent="…";
if(a=="g"){var d={a:"guardar",r:r};document.querySelectorAll('input[data-r="'+r+'"]').forEach(function(i){if(i.value)d[i.getAttribute("data-c")]=i.value});post(d).then(function(){carga()})}
else if(a=="ys")post({a:"yt_secreto",txt:$("ytj").value}).then(function(x){m.textContent=(x.ok?"✓ ":"✗ ")+x.mensaje;if(x.ok)carga()});
else if(a=="yc")post({a:"yt_conectar"}).then(function(x){m.textContent=(x.ok?"✓ ":"✗ ")+x.mensaje;setTimeout(carga,15000)});
else if(a=="p")post({a:"probar",r:r}).then(function(x){m.textContent=(x.ok?"✓ ":"✗ ")+x.mensaje});
else if(a=="b")post({a:"borrar",r:r}).then(carga);else if(a=="i")post({a:"importar"}).then(function(x){carga()})});carga();
</script></main></body></html>
