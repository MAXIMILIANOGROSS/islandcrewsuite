<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conexiones</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d0f14;color:#f1ece2;font:15px/1.5 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:22px}
h1{font-size:22px;margin:0 0 4px}p.s{color:#aab4c4;margin:0 0 16px}.k{background:#151922;border:1px solid #ffffff18;border-top:4px solid var(--c);border-radius:14px;padding:16px;margin:14px 0}
.k h2{margin:0;font-size:18px;color:var(--c)}ol{margin:8px 0 10px 20px;padding:0;color:#cdd4df}input{width:100%;margin:4px 0;padding:8px 10px;border-radius:8px;border:1px solid #ffffff30;background:#0d0f14;color:#f1ece2;font:inherit}
button{padding:8px 14px;border-radius:8px;border:0;background:var(--c);color:#0d0f14;font:inherit;font-weight:bold;cursor:pointer;margin:4px 6px 0 0}button.g{background:#232a38;color:#f1ece2;font-weight:normal}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#556070;margin-right:6px}.dot.on{background:#3ddc97}.m{min-height:22px;color:#cdd4df;margin-top:6px}a{color:var(--c)}details{margin-top:8px}</style></head><body><main>
<button class="g" style="--c:#fff" onclick="location.href='/'">← Volver</button>
<h1>Conexiones</h1><p class="s">Conecta tus redes y tu canal para automatizarlos. Tus claves se guardan solo en este ordenador.</p><div id="r"></div>
<div class="k" id="pub" style="--c:#e2b04a"><h2>Publicar ahora (Facebook e Instagram)</h2><p class="s" style="margin:4px 0">Solo publica cuando tú pulsas el botón y confirmas. Instagram necesita una dirección pública de la imagen; Facebook acepta un archivo.</p>
<textarea id="pt" rows="3" placeholder="Texto de la publicación" style="width:100%;padding:8px;border-radius:8px;border:1px solid #ffffff30;background:#0d0f14;color:#f1ece2;font:inherit"></textarea>
<input id="pf" type="file" accept="image/*"><input id="pu" placeholder="Dirección pública de la imagen (https://…) para Instagram">
<label><input type="checkbox" id="pfb" checked style="width:auto"> Facebook</label> <label><input type="checkbox" id="pig" style="width:auto"> Instagram</label><br><button data-a="pub" style="--c:#e2b04a">Publicar</button><div class="m" id="m-pub"></div></div>
<script>
var R=[{id:"meta",c:"#4aa8ff",t:"Instagram y Facebook",f:[["META_FB_PAGE_ID","ID de la página de Facebook"],["META_FB_PAGE_TOKEN","Token de acceso de la página"],["META_IG_USER_ID","ID de la cuenta de Instagram"]],
p:["<b>Instagram profesional:</b> en la app de Instagram → Configuración → Tipo de cuenta → «Cambiar a cuenta profesional» (gratis).","<b>Página de Facebook:</b> crea una en <a href='https://www.facebook.com/pages/create' target='_blank'>facebook.com/pages/create</a> y enlázala a tu Instagram (Configuración de la página → Cuentas vinculadas).","<b>App de Meta:</b> entra en <a href='https://developers.facebook.com/apps' target='_blank'>developers.facebook.com/apps</a> → Crear app → tipo «Empresa» → añade el producto «Instagram» (o «Facebook Login para empresas»).","<b>Token:</b> abre el <a href='https://developers.facebook.com/tools/explorer' target='_blank'>Explorador de la Graph API</a>, elige tu app, pulsa «Generar token de acceso», luego el icono ℹ → «Extender token» (dura 60 días; el token de página que sale de uno largo no caduca) y marca pages_show_list, pages_manage_posts, instagram_basic y instagram_content_publish.","<b>Token de página:</b> en el Explorador escribe <code>me/accounts</code> y pulsa Enviar: copia de tu página el <code>id</code> (ID de página) y el <code>access_token</code> (token de página).","<b>ID de Instagram:</b> escribe <code>TU_ID_DE_PAGINA?fields=instagram_business_account</code> y copia el <code>id</code> que aparece dentro.","Pega los tres datos abajo, pulsa Guardar y luego Probar. Debe decirte el nombre de tu página y tu @usuario."],u:"https://developers.facebook.com/apps"},
{id:"youtube",c:"#ff4a4a",t:"YouTube",f:[],yt:1,
p:["Entra en console.cloud.google.com, crea un proyecto (gratis) y activa «YouTube Data API v3».","En «Credenciales» crea un «ID de cliente OAuth» de tipo «Aplicación de escritorio» y descarga el JSON.","Abre ese archivo con un editor de texto, copia todo y pégalo en la caja de abajo.","Pulsa «Conectar YouTube», elige tu canal y acepta el permiso. Desde ahí sube sin más pasos."],u:"https://console.cloud.google.com/apis/library/youtube.googleapis.com"}];
function T(s){return window.icT?window.icT(s):s}function tm1(s){var m=String(s).match(/^no se pudo \((.*)\)$/);return m?T('no se pudo')+' ('+m[1]+')':T(s)}function tm(s){return String(s||'').split(' · ').map(function(p){var m=p.match(/^(Facebook|Instagram): (.*)$/);return m?m[1]+': '+tm1(m[2]):tm1(p)}).join(' · ')}
function $(x){return document.getElementById(x)}function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function post(o){return fetch("/api/conexiones",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(o)}).then(function(r){return r.json()})}
function pinta(e){$("r").innerHTML=R.map(function(x){var s=e.estado[x.id];return '<div class="k" style="--c:'+x.c+'"><h2><i class="dot'+(s.ok?" on":"")+'"></i>'+T(x.t)+' · <small>'+(s.ok?"Conectado":"Sin conectar")+'</small></h2>'+
'<details'+(s.ok?"":" open")+'><summary>¿No sabes cómo? Pasos con enlaces</summary><ol>'+x.p.map(function(p){return "<li>"+T(p)+"</li>"}).join("")+'</ol><a href="'+x.u+'" target="_blank">Abrir página oficial</a></details>'+
(x.yt?'<textarea id="ytj" rows="3" placeholder="'+T("Pega aquí el contenido del archivo JSON")+(s.campos["client_secret.json"]?" "+T("(ya guardado)"):"")+'" style="width:100%;margin:4px 0;padding:8px;border-radius:8px;border:1px solid #ffffff30;background:#0d0f14;color:#f1ece2;font:inherit"></textarea><button data-a="ys" data-r="youtube">Guardar archivo</button><button data-a="yc" data-r="youtube">Conectar YouTube</button>':"")+x.f.map(function(f){return '<input data-r="'+x.id+'" data-c="'+f[0]+'" type="password" placeholder="'+T(f[1])+(s.campos[f[0]]?" "+T("(ya guardado)"):"")+'" autocomplete="off">'}).join("")+
'<button data-a="g" data-r="'+x.id+'">Guardar</button><button data-a="p" data-r="'+x.id+'" class="g">Probar</button><button data-a="b" data-r="'+x.id+'" class="g">Desconectar</button>'+(x.id=="meta"&&e.dev?'<button data-a="i" class="g">Usar las de islandcrew.es</button>':"")+'<div class="m" id="m-'+x.id+'"></div></div>'}).join("")}
function carga(){fetch("/api/conexiones").then(function(r){return r.json()}).then(pinta)}
document.addEventListener("click",function(e){var a=e.target.getAttribute("data-a");if(!a)return;var r=e.target.getAttribute("data-r"),m=$("m-"+(r||"meta"));m.textContent="…";
if(a=="g"){var d={a:"guardar",r:r};document.querySelectorAll('input[data-r="'+r+'"]').forEach(function(i){if(i.value)d[i.getAttribute("data-c")]=i.value});post(d).then(function(){carga()})}
else if(a=="ys")post({a:"yt_secreto",txt:$("ytj").value}).then(function(x){m.textContent=(x.ok?"✓ ":"✗ ")+tm(x.mensaje);if(x.ok)carga()});
else if(a=="yc")post({a:"yt_conectar"}).then(function(x){m.textContent=(x.ok?"✓ ":"✗ ")+tm(x.mensaje);setTimeout(carga,15000)});
else if(a=="pub"){var mp=$("m-pub");if(!confirm(T("¿Publicar ahora? Se verá en tus redes y no se puede deshacer desde la suite.")))return;mp.textContent="…";var fi=$("pf").files[0],go=function(b64){post({a:"publicar",txt:$("pt").value,img:b64,url:$("pu").value,fb:$("pfb").checked,ig:$("pig").checked}).then(function(x){mp.textContent=tm(x.mensaje)})};if(fi){var rd=new FileReader();rd.onload=function(){go(rd.result.split(",")[1])};rd.readAsDataURL(fi)}else go("")}
else if(a=="p")post({a:"probar",r:r}).then(function(x){m.textContent=(x.ok?"✓ ":"✗ ")+tm(x.mensaje)});
else if(a=="b")post({a:"borrar",r:r}).then(carga);else if(a=="i")post({a:"importar"}).then(function(x){carga()})});carga();
</script></main></body></html>
