<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Island Crew Intelligence Center</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0f14;color:#f1ece2;font:15px/1.5 system-ui,Georgia,sans-serif}
.h{display:flex;align-items:center;gap:16px;padding:16px 24px;background:linear-gradient(90deg,#0d0f14,#142033);border-bottom:1px solid #ffffff18;flex-wrap:wrap}
.h img{width:64px;height:46px;object-fit:cover;border-radius:10px}.h h1{margin:0;font-size:20px}.h small{letter-spacing:.2em;color:#aab4c4;font-size:10px;display:block}
.h .sp{flex:1}select,input,button{font:inherit;border-radius:8px;border:1px solid #ffffff30;background:#151922;color:#f1ece2;padding:7px 10px}
button{cursor:pointer}button.p{background:#e2b04a;color:#0d0f14;border:0;font-weight:bold}button.s{padding:4px 9px;font-size:13px}
.tabs{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid #ffffff18;overflow:auto}.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:#aab4c4;white-space:nowrap}.tabs button.on{color:#fff;border-color:#e2b04a}
main{padding:20px 24px 50px;max-width:1280px;margin:auto}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kc{background:#151922;border:1px solid #ffffff18;border-radius:12px;padding:12px 14px;border-top:3px solid var(--c,#e2b04a)}.kc .l{color:#aab4c4;font-size:13px}.kc .v{font-size:28px;font-weight:bold}.kc .t{font-size:11px;color:#8d98aa}.up{color:#3ddc97}.dn{color:#ff7a6b}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.bx{background:#151922;border:1px solid #ffffff18;border-radius:12px;padding:14px}.bx h3{margin:0 0 8px;font-size:14px;color:#cdd4df}
.nt{font-size:12px;color:#8d98aa;margin-top:6px}.vac{color:#8d98aa;padding:20px 0;text-align:center;font-size:13px}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:6px}.lg span{cursor:pointer}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
#tip{position:fixed;pointer-events:none;background:#000d;border:1px solid #ffffff40;border-radius:8px;padding:5px 9px;font-size:12px;display:none;z-index:9}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid #ffffff14;text-align:left}th{color:#aab4c4;font-weight:normal}
.al{border-left:4px solid var(--c);background:#151922;border-radius:8px;padding:10px 14px;margin:8px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.al .tx{flex:1;min-width:220px}.al small{color:#aab4c4;display:block}
#md{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:8}#md>div{background:#151922;border-radius:14px;max-width:760px;width:94%;max-height:84vh;overflow:auto;padding:18px}
.ch{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid #ffffff40;color:#cdd4df}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
</style></head><body>
<div class="h"><img src="__CONTROL__"><div><small>ISLAND CREW</small><h1 id="ti"></h1></div><div class="sp"></div>
<select id="pe"></select><span id="cu" style="display:none"><input type="date" id="d1"> <input type="date" id="d2"></span><button id="rf">↻</button><button id="vo"></button></div>
<div class="tabs" id="tb"></div><main id="mn"></main><div id="tip"></div><div id="md"><div id="mc"></div></div>
<script>
var DIC={},DATA=null,TAB="g",SEL=null;
function T(s){return DIC[s]||s}function $(x){return document.getElementById(x)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function nf(v){return v==null?"—":(Math.round(v*10)/10).toLocaleString()}
var C={musica:"#ffb020",carta:"#3fbf7f",social:"#4aa8ff"},NM={musica:"Cabra Beats",carta:"Carta Viva",social:"Cabra Social"};
var PER=[["hoy","Hoy"],["7d","Últimos 7 días"],["30d","Últimos 30 días"],["mes","Este mes"],["mes_ant","Mes anterior"],["trim","Este trimestre"],["anio","Este año"],["custom","Personalizado"]];
var TABS=[["g","Global"],["musica","Cabra Beats"],["carta","Carta Viva"],["social","Cabra Social"],["cmp","Comparativa"],["an","Analista de negocio"],["al","Alertas"],["fi","Finanzas"],["inf","Informes"]];
function tip(e,h){var t=$("tip");if(!h){t.style.display="none";return}t.innerHTML=h;t.style.display="block";t.style.left=Math.min(innerWidth-190,e.clientX+12)+"px";t.style.top=(e.clientY+14)+"px"}
document.addEventListener("mousemove",function(e){var el=e.target.closest&&e.target.closest("[data-tp]");tip(e,el?el.getAttribute("data-tp"):null)});
function q(){var p=$("pe").value;return "p="+p+(p=="custom"?"&d1="+$("d1").value+"&d2="+$("d2").value:"")}
function carga(){fetch("/api/centro?"+q()).then(function(r){return r.json()}).then(function(d){DATA=d;DIC=d.dic||{};pinta()}).catch(function(){$("mn").innerHTML='<div class="vac">'+T("No se pudieron leer los datos.")+'</div>'})}
function init(){$("ti").textContent="Intelligence Center";$("vo").textContent="← "+T("Volver");$("vo").onclick=function(){location.href="/"};
$("pe").innerHTML=PER.map(function(p){return '<option value="'+p[0]+'"'+(p[0]=="30d"?" selected":"")+'>'+T(p[1])+'</option>'}).join("");
$("pe").onchange=function(){$("cu").style.display=this.value=="custom"?"inline":"none";if(this.value!="custom")carga()};$("d2").onchange=carga;$("rf").onclick=carga;carga();setInterval(carga,30000)}
function tabs(){$("tb").innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]==TAB?"on":"")+'">'+T(t[1])+'</button>'}).join("")}
$("tb").onclick=function(e){var t=e.target.getAttribute("data-t");if(t){TAB=t;pinta()}};
function kpis(l,col){return '<div class="kp">'+l.map(function(k){var v=k.v==null?"—":nf(k.v)+(k.u||""),dl="";if(k.ant!=null&&k.v!=null){var d=k.ant?100*(k.v-k.ant)/k.ant:null;dl=d==null?"":' <span class="'+(d>=0?"up":"dn")+'">'+(d>=0?"▲":"▼")+Math.abs(Math.round(d))+"%</span>"}
return '<div class="kc" style="--c:'+(col||"#e2b04a")+'"'+(k.d?' data-tp="'+esc(k.d+" · "+(k.s||""))+'"':"")+'><div class="l">'+esc(k.l)+'</div><div class="v">'+v+dl+'</div>'+(k.ty?'<div class="t">'+T(k.ty=="real"?"dato real":k.ty)+'</div>':"")+'</div>'}).join("")+'</div>'}
function donut(b,u){var s=b.d.reduce(function(a,x){return a+x.v},0);if(!s)return box(b.t,'<div class="vac">'+T("Sin datos todavía")+'</div>');var a=0,r=54,R=2*Math.PI*r,o="";
b.d.forEach(function(x,i){if(!x.v)return;var l=R*x.v/s;o+='<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+x.c+'" stroke-width="22" stroke-dasharray="'+l+" "+(R-l)+'" stroke-dashoffset="'+(-a)+'" transform="rotate(-90 70 70)" data-tp="'+esc(x.l+": "+x.v+" ("+Math.round(100*x.v/s)+"%)")+'"'+(x.f?' data-f="'+u+"|"+x.f[0]+"|"+esc(x.f[1])+'" style="cursor:pointer"':"")+'/>';a+=l});
return box(b.t,'<svg viewBox="0 0 140 140" width="150">'+o+'<text x="70" y="75" text-anchor="middle" fill="#f1ece2" font-size="22" font-weight="bold">'+s+'</text></svg><div class="lg">'+b.d.map(function(x){return '<span'+(x.f?' data-f="'+u+"|"+x.f[0]+"|"+esc(x.f[1])+'"':"")+'><i style="background:'+x.c+'"></i>'+esc(x.l)+" "+x.v+'</span>'}).join("")+'</div>')}
function box(t,h,n){return '<div class="bx"><h3>'+esc(t)+'</h3>'+h+(n?'<div class="nt">'+esc(n)+'</div>':"")+'</div>'}
function bars(b,col){var m=Math.max.apply(null,b.d.map(function(x){return x.v}).concat([1])),w=300/b.d.length;if(!b.d.some(function(x){return x.v}))return box(b.t,'<div class="vac">'+T("Sin actividad registrada en este periodo")+'</div>');
return box(b.t,'<svg viewBox="0 0 320 130" width="100%">'+b.d.map(function(x,i){var h=100*x.v/m;return '<rect x="'+(10+i*w+2)+'" y="'+(110-h)+'" width="'+(w-4)+'" height="'+h+'" rx="3" fill="'+col+'" data-tp="'+esc(x.x+": "+x.v)+'"/><text x="'+(10+i*w+w/2)+'" y="124" font-size="7" fill="#8d98aa" text-anchor="middle">'+(b.d.length>14&&i%2?"":esc(x.x))+'</text>'}).join("")+'</svg>')}
function line(b,col){var n=b.d.length;if(!n||!b.d.some(function(x){return x.v}))return box(b.t,'<div class="vac">'+T("Sin actividad registrada en este periodo")+'</div>');var m=Math.max.apply(null,b.d.map(function(x){return x.v}).concat([1])),pt=b.d.map(function(x,i){return [10+(n>1?300*i/(n-1):150),110-100*x.v/m,x]});
var pl=pt.map(function(p){return p[0]+","+p[1]}).join(" ");return box(b.t,'<svg viewBox="0 0 320 130" width="100%"><polygon points="10,110 '+pl+' '+pt[n-1][0]+',110" fill="'+col+'" opacity=".15"/><polyline points="'+pl+'" fill="none" stroke="'+col+'" stroke-width="2"/>'+pt.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="'+col+'" data-tp="'+esc(p[2].x+": "+p[2].v)+'"/>'}).join("")+'<text x="10" y="126" font-size="7" fill="#8d98aa">'+esc(b.d[0].x)+'</text><text x="310" y="126" font-size="7" fill="#8d98aa" text-anchor="end">'+esc(b.d[n-1].x)+'</text></svg>')}
function funnel(b,col){var m=Math.max.apply(null,b.d.map(function(x){return x.v}).concat([1]));return box(b.t,b.d.map(function(x,i){var p=b.d[0].v?Math.round(100*x.v/b.d[0].v):0;return '<div style="margin:6px 0"><div style="font-size:12px;color:#cdd4df">'+esc(x.l)+' — <b>'+x.v+'</b>'+(i?' ('+p+'%)':"")+'</div><div style="background:#0d0f14;border-radius:6px"><div style="height:14px;border-radius:6px;background:'+col+';width:'+(100*x.v/m)+'%"></div></div></div>'}).join(""),b.nota)}
function rank(b,col){if(!b.d.length)return box(b.t,'<div class="vac">'+T("Sin datos todavía")+'</div>');var m=b.d[0].v||1;return box(b.t,b.d.map(function(x){return '<div style="margin:5px 0;font-size:13px" data-tp="'+esc(x.l+": "+x.v)+'">'+esc(x.l)+' <b>'+x.v+'</b><div style="height:8px;border-radius:4px;background:'+col+';width:'+(100*x.v/m)+'%"></div></div>'}).join(""))}
function ring(a,col){if(a.pct==null)return box(a.l,'<div class="vac">'+T("Sin datos todavía")+'</div>');var r=44,R=2*Math.PI*r,l=R*a.pct/100;return box(a.l,'<svg viewBox="0 0 120 120" width="130"><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="#0d0f14" stroke-width="14"/><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+l+" "+(R-l)+'" transform="rotate(-90 60 60)"/><text x="60" y="67" text-anchor="middle" fill="#f1ece2" font-size="22" font-weight="bold">'+Math.round(a.pct)+'%</text></svg>')}
function unidad(u){var d=DATA.unidades[u],c=C[u],x=DATA.comparativa[u],h=kpis(d.kpi,c);
h+='<div class="row"><span class="ch">'+T("Periodo")+": "+x.act+" · "+T("anterior")+": "+x.ant+(x.var!=null?" ("+(x.var>=0?"+":"")+Math.round(x.var)+"%)":"")+'</span><button class="s" data-f="'+u+'|all|">'+T("Ver registros")+'</button></div>';
h+='<div class="gr">'+line(d.linea,c)+donut(d.donut_estado,u)+donut(d.donut_cat,u)+bars(d.barras,c)+(d.barras2?bars(d.barras2,c):"")+funnel(d.embudo,c)+rank(d.ranking,c)+ring(d.anillo,c)+'</div>';return h}
function global(){var h=kpis(DATA.global,"#e2b04a");var u=DATA.comparativa;h+='<div class="gr">'+["musica","carta","social"].map(function(k){var d=DATA.unidades[k];return donut({t:NM[k]+" · "+d.donut_estado.t,d:d.donut_estado.d},k)}).join("")+
box(T("Actividad por unidad"),'<svg viewBox="0 0 320 120" width="100%">'+["musica","carta","social"].map(function(k,i){var m=Math.max(1,u.musica.act,u.carta.act,u.social.act);return '<rect x="'+(30+i*95)+'" y="'+(100-90*u[k].act/m)+'" width="60" height="'+(90*u[k].act/m)+'" fill="'+C[k]+'" rx="4" data-tp="'+NM[k]+": "+u[k].act+'"/><text x="'+(60+i*95)+'" y="114" font-size="9" fill="#8d98aa" text-anchor="middle">'+NM[k]+'</text>'}).join("")+'</svg>')+line({t:T("Activos generados (instantáneas diarias)"),d:DATA.historial},"#e2b04a")+'</div>';
h+='<div class="nt" style="margin-top:14px">'+T("Todas las cifras salen de los ficheros reales de tus programas. Lo que no se registra (escaneos de QR, audiencia, ingresos) aparece como «sin datos» y no se inventa.")+'</div>';return h}
function cmp(){var u=DATA.comparativa,fl=function(v){return v==null?"—":nf(v)};var f=function(l,k,m){return '<tr><td>'+T(l)+'</td>'+["musica","carta","social"].map(function(z){return '<td>'+(m?m(u[z][k]):fl(u[z][k]))+'</td>'}).join("")+'</tr>'};
return '<div class="bx"><table><tr><th></th>'+["musica","carta","social"].map(function(k){return '<th style="color:'+C[k]+'">'+NM[k]+'</th>'}).join("")+'</tr>'+f("Actividad en el periodo","act")+f("Periodo anterior","ant")+f("Variación","var",function(v){return v==null?"—":(v>=0?"+":"")+Math.round(v)+"%"})+f("Completados","ok")+f("Pendientes","pend")+f("Ingresos","ing")+f("Gastos","gas")+f("Beneficio","ben")+'</table><div class="nt">'+T("Ingresos y gastos solo aparecen si los has registrado en Finanzas. La variación compara con el periodo anterior de igual duración.")+'</div></div>'}
function analista(){var h='<div class="row"><button class="p" id="rs">'+T("Resumen ejecutivo con IA")+'</button></div><div id="rsx"></div>';if(!DATA.analista.length)return h+'<div class="vac">'+T("Sin datos todavía")+'</div>';
return h+DATA.analista.map(function(a){return '<div class="bx" style="margin:10px 0"><b>'+esc(a.o)+'</b><table><tr><th>'+T("Métrica")+'</th><td>'+esc(a.m)+'</td></tr><tr><th>'+T("Periodo")+'</th><td>'+esc(a.p)+'</td></tr><tr><th>'+T("Impacto")+'</th><td>'+esc(a.i)+'</td></tr><tr><th>'+T("Acción sugerida")+'</th><td>'+esc(a.a)+'</td></tr><tr><th>'+T("Confianza")+'</th><td>'+esc(a.c)+'</td></tr></table></div>'}).join("")+'<div class="nt">'+T("El analista describe correlaciones y hechos registrados; no afirma causas ni predice ingresos.")+'</div>'}
function alertas(){var CO={critica:"#ff5a4a",aviso:"#ffb020",oportunidad:"#3ddc97",info:"#4aa8ff"},fl=window.FA||"todas",L=DATA.alertas.filter(function(a){return fl=="todas"||a.nivel==fl});
var h='<div class="row">'+["todas","critica","aviso","oportunidad","info"].map(function(n){return '<button class="s'+(n==fl?" p":"")+'" data-fa="'+n+'">'+T(n)+'</button>'}).join("")+'</div>';if(!L.length)return h+'<div class="vac">'+T("Sin alertas")+'</div>';
return h+L.map(function(a){return '<div class="al" style="--c:'+CO[a.nivel]+';opacity:'+(a.estado=="resuelta"?.5:1)+'"><div class="tx"><b>'+esc(a.t)+'</b><small>'+esc(a.d)+'</small></div><span class="ch">'+T(a.nivel)+" · "+T(a.estado)+'</span>'+(a.u?'<button class="s" data-f="'+a.u+'|all|">'+T("Ver registros")+'</button>':"")+(a.estado=="nueva"?'<button class="s" data-ac="'+a.id+'|vista">'+T("Reconocer")+'</button>':"")+(a.estado!="resuelta"?'<button class="s" data-ac="'+a.id+'|resuelta">'+T("Resolver")+'</button>':'<button class="s" data-ac="'+a.id+'|nueva">'+T("Reabrir")+'</button>')+'</div>'}).join("")}
function fin(){var f=DATA.finanzas,h='<div class="bx"><h3>'+T("Añadir movimiento")+'</h3><div class="row"><input type="date" id="fd"><select id="ft"><option value="ingreso">'+T("Ingreso")+'</option><option value="gasto">'+T("Gasto")+'</option></select><select id="fu">'+["musica","carta","social","general"].map(function(k){return '<option value="'+k+'">'+(NM[k]||T("General"))+'</option>'}).join("")+'</select><input id="fc" placeholder="'+T("Categoría")+'" list="cl"><datalist id="cl"><option>Suscripciones</option><option>Servicios</option><option>Herramientas</option></datalist><input id="fi" type="number" step="0.01" placeholder="'+T("Importe")+'" style="width:110px"><input id="fm" placeholder="'+T("Moneda")+'" value="EUR" style="width:70px"><button class="p" id="fa">'+T("Añadir")+'</button></div></div>';
if(!f.hay)return h+'<div class="vac">'+T("No hay movimientos financieros registrados. Los ingresos y gastos se introducen a mano: la suite no los conoce ni los estima.")+'</div>';
var u=f.por_unidad;h+='<div class="bx" style="margin-top:12px"><table><tr><th></th><th>'+T("Ingresos")+'</th><th>'+T("Gastos")+'</th><th>'+T("Beneficio")+'</th></tr>'+["musica","carta","social","general"].map(function(k){return '<tr><td>'+(NM[k]||T("General"))+'</td><td>'+nf(u[k].ing)+'</td><td>'+nf(u[k].gas)+'</td><td>'+nf(u[k].ing-u[k].gas)+'</td></tr>'}).join("")+'</table><div class="nt">'+T("Ingresos recurrentes (categoría Suscripciones)")+": "+nf(f.recurrente)+'</div></div>';
h+='<div class="bx" style="margin-top:12px"><table>'+f.movs.map(function(m,i){return '<tr><td>'+esc(m.fecha)+'</td><td>'+T(m.tipo=="ingreso"?"Ingreso":"Gasto")+'</td><td>'+esc(NM[m.unidad]||T("General"))+'</td><td>'+esc(m.categoria||"")+'</td><td>'+esc(m.importe)+" "+esc(m.moneda||"")+'</td><td><button class="s" data-fx="'+i+'">✕</button></td></tr>'}).join("")+'</table></div>';return h}
function inf(){return '<div class="bx"><h3>'+T("Generar informe PDF")+'</h3><div class="row"><select id="ik">'+[["semanal","Semanal"],["mensual","Mensual"],["trimestral","Trimestral"],["anual","Anual"],["consolidado","Consolidado"],["musica","Cabra Beats"],["carta","Carta Viva"],["social","Cabra Social"]].map(function(p){return '<option value="'+p[0]+'">'+T(p[1])+'</option>'}).join("")+'</select><button class="p" id="ig">'+T("Crear PDF")+'</button></div><div id="im" class="nt"></div></div><div class="bx" style="margin-top:12px"><h3>'+T("Objetivos de actividad por periodo")+'</h3><div class="row">'+["musica","carta","social"].map(function(k){return NM[k]+' <input type="number" min="0" id="ob-'+k+'" value="'+(DATA.objetivos[k]||"")+'" style="width:80px">'}).join(" ")+'<button class="s" id="og">'+T("Guardar")+'</button></div>'+(DATA.objetivos&&Object.keys(DATA.objetivos).length?'<div class="nt">'+["musica","carta","social"].map(function(k){var o=DATA.objetivos[k];return o?NM[k]+": "+DATA.comparativa[k].act+" / "+o+" ("+Math.round(100*DATA.comparativa[k].act/o)+"%)":""}).filter(Boolean).join(" · ")+'</div>':"")+'</div>'}
function pinta(){tabs();var m=$("mn"),h=TAB=="g"?global():TAB=="cmp"?cmp():TAB=="an"?analista():TAB=="al"?alertas():TAB=="fi"?fin():TAB=="inf"?inf():unidad(TAB);m.innerHTML=h}
function post(a,d){d.a=a;return fetch("/api/centro",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(d)}).then(function(r){return r.json()})}
function registros(u,k,v){var L=DATA.registros[u].filter(function(r){return k=="all"||r[k]==v});$("mc").innerHTML='<div class="row"><b style="flex:1">'+NM[u]+(v?" · "+esc(v):"")+" ("+L.length+')</b><button class="s" id="cm">✕</button></div><table>'+(L.length?L.map(function(r){return '<tr><td>'+esc(r.n)+'</td><td>'+esc(r.k)+'</td><td><span class="ch">'+esc(r.e)+'</span></td><td>'+(r.t?new Date(r.t*1000).toLocaleDateString():"")+'</td><td>'+esc(r.x||"")+'</td></tr>'}).join(""):'<tr><td>'+T("Sin datos todavía")+'</td></tr>')+'</table>';$("md").style.display="flex";$("cm").onclick=function(){$("md").style.display="none"}}
document.addEventListener("click",function(e){var el=e.target.closest("[data-f]");if(el){var p=el.getAttribute("data-f").split("|");return registros(p[0],p[1],p[2])}
if(e.target.id=="md")e.target.style.display="none";var fa=e.target.getAttribute("data-fa");if(fa){window.FA=fa;return pinta()}
var ac=e.target.getAttribute("data-ac");if(ac){var p=ac.split("|");return post("alerta",{id:p[0],estado:p[1]}).then(carga)}
var fx=e.target.getAttribute("data-fx");if(fx!=null)return post("fin_borrar",{i:+fx}).then(carga);
if(e.target.id=="fa"){var i=parseFloat($("fi").value);if(!$("fd").value||!(i>0))return alert(T("Indica fecha e importe."));return post("fin_add",{fecha:$("fd").value,tipo:$("ft").value,unidad:$("fu").value,categoria:$("fc").value,importe:i,moneda:$("fm").value}).then(carga)}
if(e.target.id=="og")return post("objetivos",{musica:$("ob-musica").value,carta:$("ob-carta").value,social:$("ob-social").value}).then(carga);
if(e.target.id=="rs"){$("rsx").innerHTML='<div class="vac">…</div>';return post("resumen",{}).then(function(r){$("rsx").innerHTML='<div class="bx">'+esc(r.texto||r.mensaje||"")+'</div>'})}
if(e.target.id=="ig"){$("im").textContent="…";return post("informe",{k:$("ik").value,p:$("pe").value,d1:$("d1").value,d2:$("d2").value}).then(function(r){$("im").textContent=r.mensaje||""})}});
init();
</script></body></html>
