<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carta Viva</title>
<style>
:root{--bg:#0e1116;--c:#171c24;--c2:#1f2631;--t:#eef2f7;--m:#8b97a8;--a:#3fbf7f;--ok:#4ade80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #ffffff14;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:18px;margin:0;flex:1}h1 b{color:var(--a)}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--c2);border:1px solid #ffffff20;border-radius:10px;padding:8px 12px}
button{cursor:pointer}button.p{background:var(--a);color:#06150d;border:0;font-weight:700}button.s{padding:4px 9px;font-size:13px}button:disabled{opacity:.5}
main{max-width:980px;margin:0 auto;padding:18px}.card{background:var(--c);border-radius:16px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}label{display:block;color:var(--m);font-size:12px;margin:8px 0 3px}
.plato{display:grid;grid-template-columns:150px 1fr;gap:14px}.foto{aspect-ratio:9/16;background:var(--c2);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--m);font-size:13px;text-align:center;cursor:pointer;position:relative}
.foto img,.foto video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.f{display:flex;gap:6px}.f>input,.f>textarea{flex:1;width:100%}textarea{resize:vertical;min-height:54px}
.al{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}.al span{border:1px solid #ffffff25;border-radius:99px;padding:2px 9px;font-size:12px;cursor:pointer}.al span.on{background:var(--a);color:#06150d;border-color:var(--a)}
#bar{position:sticky;bottom:0;background:#0e1116f2;border-top:1px solid #ffffff14;padding:12px 20px;display:flex;gap:10px;align-items:center}#msg{flex:1;color:var(--m);font-size:13px}
.m{color:var(--m)}.rm{background:#3a1d1d;border:0}
.ic{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:2px solid #3fbf7f;background:#00000040}.ic img{width:42px;height:42px;border-radius:50%;border:2px solid #3fbf7f;object-fit:cover}.ic b{letter-spacing:.14em;font-size:13px;color:#3fbf7f}.ic span{color:#8b97a8;font-size:12px}.ic em{margin-left:auto;font-style:normal;color:#3fbf7f;font-weight:bold}
</style></head><body>
<div class="ic"><img src="__AV_carta__"><b>ISLAND CREW</b><span>Marketing Suite</span><em>Carta Viva</em></div>
<header><h1>Carta <b>Viva</b> <span class="m" style="font-weight:400;font-size:13px">· un vídeo por plato</span></h1><select id="rs" style="flex:none"></select><button onclick="nuevo()">+ Restaurante</button></header>
<main id="m"></main>
<div id="bar"><span id="msg">Elige o crea un restaurante.</span><button onclick="abrir()">📁 Carpeta</button><button onclick="ver()">👁 Ver carta</button><button class="p" id="gen" onclick="generar()">🎬 Crear vídeos y carta</button></div>
<script>
const TEMAS={canario:{n:"Canario deluxe",papel:"#f5ecd8",tinta:"#2b2118",marco:"#d4a94f",acento:"#a8561f",panel:"#150f0a"},marino:{n:"Marino",papel:"#f4f7fa",tinta:"#12263a",marco:"#c7a35a",acento:"#0b4f8a",panel:"#0b1620"},chiringuito:{n:"Chiringuito",papel:"#fff6e0",tinta:"#3a2a1a",marco:"#e07a3a",acento:"#d9532b",panel:"#1d1410"},oscuro:{n:"Oscuro elegante",papel:"#1e1b18",tinta:"#efe6d6",marco:"#c9a24d",acento:"#e2bd68",panel:"#0c0a09"},rustico:{n:"Rústico",papel:"#efe3cc",tinta:"#3b2a1c",marco:"#8a6a3b",acento:"#7a3b1e",panel:"#1f1710"}};
const FUE={clasica:["Clásica","Georgia,serif"],elegante:["Elegante","Didot,Georgia,serif"],moderna:["Moderna","'Helvetica Neue',Arial,sans-serif"],rustica:["Rústica","Palatino,Georgia,serif"],manuscrita:["Manuscrita (solo títulos)","'Snell Roundhand','Brush Script MT',cursive"]};
function tema(k){if(!k)return;C.tema=k;for(const x of ["papel","tinta","marco","acento","panel"])C["color_"+x]=TEMAS[k][x];guardar();draw()}
const T="__TOKEN__",AL=__ALERGENOS__;let R="",C=null,tim=null,ES=null;const mb=b=>b>=1e9?(b/1e9).toFixed(2)+" GB":(b/1e6).toFixed(1)+" MB";
const api=(u,d)=>fetch(u,d?{method:"POST",headers:{"x-cv":T,"Content-Type":"application/json"},body:JSON.stringify(d)}:{headers:{"x-cv":T}}).then(r=>r.json());
const $=s=>document.querySelector(s),e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
async function init(){const l=await api("/api/restaurantes");$("#rs").innerHTML=l.map(x=>`<option value="${x.id}">${e(x.nombre)} (${x.platos})</option>`).join("");if(l.length){R=R&&l.find(x=>x.id==R)?R:l[0].id;$("#rs").value=R;await cargar()}else{$("#m").innerHTML='<div class="card">Crea tu primer restaurante con «+ Restaurante».</div>'}}
$("#rs").onchange=()=>{R=$("#rs").value;cargar()};
async function nuevo(){const n=prompt("Nombre del restaurante:");if(!n)return;const r=await api("/api/crear",{nombre:n});R=r.id;await init()}
async function liberar(que,nombre){if(!confirm("¿Borrar "+nombre+" de «"+C.nombre+"»?\n\nSe puede volver a crear en cualquier momento. Tus fotos, logo y fondo no se tocan."))return;msg("Borrando…");const r=await api("/api/liberar",{r:R,que});if(r.error)return msg("✖ "+r.error);msg("✔ Liberados "+mb(Math.max(0,r.liberado)));await cargar()}
async function cargar(){C=await api("/api/carta?r="+R);ES=await api("/api/espacio?r="+R);for(const [k,fn] of [["_promo","promo/a4.png"],["_logo","marca/logo.png"],["_fondo","marca/fondo.jpg"],["_qr","web/qr.png"]]){try{const x=await fetch(`/media/${R}/${fn}?t=${T}`);if(x.ok)C[k]=1}catch(e){}}draw()}
let sv=null;function guardar(){clearTimeout(sv);sv=setTimeout(()=>{const c={...C};delete c._logo;delete c._fondo;delete c._qr;delete c._promo;api("/api/guardar",{r:R,carta:c})},400)}
function draw(){const P=C.platos||[];$("#m").innerHTML=`<div class="card"><div class="row"><div><label>Nombre del restaurante</label><input value="${e(C.nombre)}" oninput="C.nombre=this.value;guardar()"></div><div><label>Lema (opcional)</label><input value="${e(C.lema)}" oninput="C.lema=this.value;guardar()"></div></div><div class="row" style="margin-top:6px"><div><label>Logo del restaurante</label><div class="f"><button class="s" onclick="marca('logo')">${C._logo?"✔ Cambiar logo":"Subir logo"}</button>${C._logo?`<img src="/media/${R}/marca/logo.png?t=${T}&v=${C._logo}" style="height:34px;border-radius:6px;background:#fff2">`:""}</div></div><div><label>Fondo de pantalla</label><div class="f"><button class="s" onclick="marca('fondo')">${C._fondo?"✔ Cambiar fondo":"Subir fondo"}</button>${C._fondo?`<img src="/media/${R}/marca/fondo.jpg?t=${T}&v=${C._fondo}" style="height:34px;border-radius:6px">`:""}</div></div></div>
<div style="margin-top:10px;border:1px solid #ffffff20;border-radius:12px;padding:12px"><b>🧹 Espacio en disco</b>${ES?`<div class="m" style="font-size:12px;margin:4px 0 8px">Todo se guarda en el disco T5 EVO: <i>${e(ES.carpeta.replace(/^\/Volumes\//,""))}</i> · Total ${mb(ES.total)}</div>
<div class="row" style="gap:8px">${[["videos","🎬 Vídeos creados",ES.videos,"Se vuelven a crear solos desde las fotos cuando pulses «Crear vídeos y carta»."],["web","🌐 Carpeta «web» (la que subes a internet)",ES.web,"Copia de los vídeos para publicar. Bórrala cuando ya esté subida; se rehace al crear la carta."],["promo","🖨 QR, flyers y banners",ES.promo,"Se rehacen con «Crear y descargar»."],["descargas","⬇ Copia en Descargas (disco del Mac)",ES.descargas,"La carpeta «Carta Viva - ...» de tu Mac. Es la que más conviene borrar para liberar el Mac."]].map(([k,n,b,t])=>`<div style="flex:1;min-width:230px;background:#ffffff08;border-radius:10px;padding:10px"><b style="font-size:13px">${n}</b><div style="font-size:18px;margin:2px 0">${mb(b)}</div><div class="m" style="font-size:11px;min-height:44px">${t}</div><button class="s" ${b?"":"disabled"} onclick="liberar(['${k}'],'${n.replace(/'/g,"")}')">Borrar</button></div>`).join("")}</div>
<div class="row" style="margin-top:8px"><button class="s" style="flex:none" onclick="liberar(['web','promo','descargas'],'todas las copias (web, promoción y Descargas)')">🧹 Borrar solo copias (recomendado)</button><button class="s rm" style="flex:none" onclick="liberar(['videos','web','promo','descargas'],'TODO lo generado (vídeos, web, promoción y Descargas)')">Borrar todo lo generado</button></div>
<div class="m" style="font-size:11px;margin-top:6px">Nunca se borran tus fotos de los platos (${mb(ES.fotos)}) ni el logo y el fondo (${mb(ES.marca)}), así que siempre puedes volver a crear todo.</div>`:'<span class="m">Calculando…</span>'}</div>
<div style="margin-top:10px;border:1px solid #ffffff20;border-radius:12px;padding:12px"><b>🎨 Estilo del local</b><div class="row"><div><label>Tema (rellena los colores)</label><select onchange="tema(this.value)"><option value="">Personalizado</option>${Object.entries(TEMAS).map(([k,v])=>`<option value="${k}" ${(C.tema||"canario")==k?"selected":""}>${v.n}</option>`).join("")}</select></div><div><label>Letra de los títulos</label><select onchange="C.fuente_titulos=this.value;guardar();draw()">${Object.entries(FUE).map(([k,v])=>`<option value="${k}" ${(C.fuente_titulos||"clasica")==k?"selected":""}>${v[0]}</option>`).join("")}</select></div><div><label>Letra de los textos</label><select onchange="C.fuente_texto=this.value;guardar();draw()">${Object.entries(FUE).filter(([k])=>k!="manuscrita").map(([k,v])=>`<option value="${k}" ${(C.fuente_texto||"clasica")==k?"selected":""}>${v[0]}</option>`).join("")}</select></div></div>
<div class="row" style="margin-top:6px">${[["papel","Papel"],["tinta","Texto"],["marco","Marco / dorado"],["acento","Títulos y precios"],["panel","Fondo oscuro"]].map(([k,n])=>`<div style="min-width:110px"><label>${n}</label><input type="color" style="padding:2px;height:34px;width:100%" value="${C["color_"+k]||(TEMAS[C.tema||"canario"]||TEMAS.canario)[k]}" oninput="C.color_${k}=this.value;C.tema=C.tema||'canario';guardar()"></div>`).join("")}</div>
<div style="margin-top:10px;border-radius:8px;padding:10px 14px;background:${C.color_papel||(TEMAS[C.tema||"canario"]||TEMAS.canario).papel};color:${C.color_tinta||(TEMAS[C.tema||"canario"]||TEMAS.canario).tinta};font-family:${FUE[C.fuente_texto||"clasica"][1]}"><b style="font-family:${FUE[C.fuente_titulos||"clasica"][1]};font-size:18px;color:${C.color_acento||(TEMAS[C.tema||"canario"]||TEMAS.canario).acento}">VISTA PREVIA · Papas arrugadas</b><br><i>Con mojo rojo y verde, al estilo canario.</i></div><div class="m" style="font-size:12px;margin-top:4px">Las letras se ven como aquí en iPhone y Mac; en algunos Android pueden cambiar a una parecida.</div></div>
<div style="margin-top:10px;border:1px solid #ffffff20;border-radius:12px;padding:12px"><b>🖨 Promoción: QR, flyer y banners</b><div class="m" style="font-size:12px">Usa el estilo, logo y fondo del local. Escribe los textos o deja que la IA los haga.</div>
<div class="row"><div><label>Título del flyer</label><div class="f"><input value="${e(C.flyer_titulo)}" placeholder="MENÚ EN VÍDEO" oninput="C.flyer_titulo=this.value;guardar()"><button class="s" onclick="iaFlyer()">✨</button></div></div><div><label>Frase para escanear</label><div class="f"><input value="${e(C.flyer_sub)}" placeholder="Mira cada plato antes de pedirlo" oninput="C.flyer_sub=this.value;guardar()"><button class="s" onclick="iaFlyer()">✨</button></div></div><div><label>Pie (dirección, teléfono, horario…)</label><div class="f"><input value="${e(C.flyer_pie)}" placeholder="C/ Mayor 5 · Tel. 922 000 000" oninput="C.flyer_pie=this.value;guardar()"><button class="s" onclick="iaFlyer()">✨</button></div></div></div>
<div class="row" style="margin-top:10px"><button class="p" style="flex:none" onclick="promo()">⬇ Crear y descargar QR + flyer A4 (PNG y PDF) + story + banner</button></div>
${C._promo?`<div class="row" style="margin-top:10px;gap:10px;align-items:flex-start"><img src="/media/${R}/promo/a4.png?t=${T}&v=${C._promo}" style="height:230px;flex:none;min-width:0;border-radius:6px"><img src="/media/${R}/promo/story.png?t=${T}&v=${C._promo}" style="height:230px;flex:none;min-width:0;border-radius:6px"><img src="/media/${R}/promo/banner.png?t=${T}&v=${C._promo}" style="width:100%;max-width:420px;border-radius:6px"></div>`:""}</div>
<div style="margin-top:10px;border:1px dashed #ffffff30;border-radius:12px;padding:12px"><b>📲 Código QR de la carta</b><label>Dirección web donde estará publicada la carta (el QR llevará a ella)</label><input style="width:100%" value="${e(C.url_publica)}" placeholder="https://micarta.pages.dev" oninput="C.url_publica=this.value;guardar()"><div class="row" style="margin-top:10px"><div style="flex:none;min-width:0">${C._qr?`<img src="/media/${R}/web/qr.png?t=${T}&v=${C._qr}" style="height:130px;background:#fff;border-radius:10px;padding:6px">`:""}</div><div class="m" style="font-size:13px;min-width:240px">${C.url_publica?"Al pulsar «Crear vídeos y carta» se crea el QR y un cartel A4 listo para imprimir.":"<b>Cómo publicarla gratis:</b> pulsa «Carpeta», entra en <i>web</i> y arrastra esa carpeta a Cloudflare Pages (pages.cloudflare.com, gratis). Copia la dirección que te da y pégala aquí."}<br><button class="s" style="margin-top:8px" onclick="cartel()">🖨 Abrir cartel con QR</button></div></div></div></div>`+
P.map((p,i)=>`<div class="card plato"><div class="foto" onclick="foto(${i})">${p.foto?`<img src="/media/${R}/fotos/${p.foto}?t=${T}&v=${p.fv||0}">`:"📷<br>Toca para poner la foto del plato"}</div><div>
<div class="row"><div><label>Plato</label><div class="f"><input value="${e(p.nombre)}" oninput="C.platos[${i}].nombre=this.value;guardar()"><button class="s" title="IA" onclick="ia(${i},['nombre'])">✨</button></div></div><div><label>Categoría</label><div class="f"><input list="cats" value="${e(p.categoria)}" oninput="C.platos[${i}].categoria=this.value;guardar()"><button class="s" onclick="ia(${i},['categoria'])">✨</button></div></div><div style="max-width:110px"><label>Precio €</label><input value="${e(p.precio)}" oninput="C.platos[${i}].precio=this.value;guardar()"></div></div>
<label>Descripción</label><div class="f"><textarea oninput="C.platos[${i}].descripcion=this.value;guardar()">${e(p.descripcion)}</textarea><button class="s" onclick="ia(${i},['descripcion'])">✨</button></div>
<label>Alérgenos <button class="s" onclick="ia(${i},['alergenos'])">✨ IA</button></label><div class="al">${AL.map(a=>`<span class="${(p.alergenos||[]).includes(a)?"on":""}" onclick="tg(${i},'${a}')">${a}</span>`).join("")}</div>
<label>Ingredientes principales (separados por comas)</label><input style="width:100%" value="${e((p.ingredientes||[]).join(", "))}" onchange="C.platos[${i}].ingredientes=this.value.split(',').map(s=>s.trim()).filter(Boolean);guardar()">
<label>Etiquetas</label><div class="al">${ET.map(t=>`<span class="${(p.etiquetas||[]).includes(t)?"on":""}" onclick="te(${i},'${t}')">${t}</span>`).join("")}</div>
<div class="row"><div><label>Maridaje / bebida recomendada</label><input value="${e(p.maridaje)}" placeholder="Ej: Vino blanco de Tacoronte" oninput="C.platos[${i}].maridaje=this.value;guardar()"></div><div><label>Disponibilidad</label><select onchange="C.platos[${i}].disponible=this.value=='1';guardar()"><option value="1" ${p.disponible!==false?"selected":""}>Disponible</option><option value="0" ${p.disponible===false?"selected":""}>No disponible hoy (se oculta)</option></select></div></div>
<div class="row" style="margin-top:10px"><div><label>Movimiento del vídeo</label><select onchange="C.platos[${i}].mov=this.value;guardar();draw()"><option value="orbita" ${(p.mov||((p.fotos||[]).length>=3?"orbita":"giro"))=="orbita"?"selected":""}>🔄 Giro 360° real (varias fotos)</option><option value="giro" ${(p.mov||((p.fotos||[]).length>=3?"orbita":"giro"))=="giro"?"selected":""}>🔄 El plato gira 360°</option><option value="cine" ${p.mov=="cine"?"selected":""}>🎬 Cámara de cine</option></select></div></div>
<div style="margin-top:8px"><label>📸 Fotos alrededor del plato — da la vuelta al plato y haz 6-8 fotos a la misma altura (${(p.fotos||[]).length} subidas${(p.fotos||[]).length<3?", mínimo 3":""})</label><div class="row" style="gap:6px">${(p.fotos||[]).map((f,k)=>`<span style="position:relative;flex:none;min-width:0"><img src="/media/${R}/fotos/${f}?t=${T}" style="height:56px;border-radius:6px"><b onclick="qf(${i},${k})" style="position:absolute;top:-4px;right:-4px;background:#c33;border-radius:99px;font-size:11px;padding:0 5px;cursor:pointer">✕</b></span>`).join("")}<button class="s" style="flex:none" onclick="fotos(${i})">+ Añadir fotos</button></div></div>
${(p.mov||((p.fotos||[]).length>=3?"orbita":"giro"))=="giro"?`<div class="row"><div><label>Tamaño del plato (${p.radio||38}%)</label><input type="range" min="20" max="48" value="${p.radio||38}" oninput="C.platos[${i}].radio=this.value;guardar()"></div><div><label>Posición ← →</label><input type="range" min="0" max="100" value="${p.cx||50}" oninput="C.platos[${i}].cx=this.value;guardar()"></div><div><label>Posición ↑ ↓</label><input type="range" min="0" max="100" value="${p.cy||50}" oninput="C.platos[${i}].cy=this.value;guardar()"></div></div>`:""}
<div class="row" style="margin-top:12px"><button class="s" onclick="ia(${i},['nombre','categoria','descripcion','alergenos'])">✨ La IA rellena todo este plato</button><button class="s" style="flex:none" onclick="mv(${i},-1)">↑</button><button class="s" style="flex:none" onclick="mv(${i},1)">↓</button><button class="s" style="flex:none" onclick="dup(${i})">⧉ Duplicar</button><button class="s rm" style="flex:none" onclick="del(${i})">Quitar</button></div></div></div>`).join("")+
`<datalist id="cats">${[...new Set(P.map(p=>p.categoria).filter(Boolean)),"Entrantes","Principales","Postres","Bebidas"].map(c=>`<option>${e(c)}`).join("")}</datalist><div class="card" style="text-align:center"><button class="p" onclick="add()">+ Añadir plato</button></div>`}
function marca(tipo){document.querySelectorAll(".fin").forEach(x=>x.remove());const f=document.createElement("input");f.type="file";f.accept="image/*,.svg";f.className="fin";f.style.cssText="position:fixed;left:-9999px;opacity:0";document.body.appendChild(f);window._fin=f;f.onchange=()=>{const fl=f.files[0];if(!fl)return;msg("Leyendo "+fl.name+"…");const url=URL.createObjectURL(fl);const im=new Image();im.onerror=()=>msg("✖ No puedo leer esa imagen. Prueba con JPG, PNG o SVG.");im.onload=async()=>{try{const mx=tipo=="fondo"?1800:1000,nw=im.naturalWidth||im.width||mx,nh=im.naturalHeight||im.height||Math.round(mx*.5),k=Math.min(1,mx/Math.max(nw,nh)),w=Math.max(1,Math.round(nw*k)),hh=Math.max(1,Math.round(nh*k)),cv=document.createElement("canvas");cv.width=w;cv.height=hh;const cx=cv.getContext("2d");if(tipo=="fondo"){cx.fillStyle="#000";cx.fillRect(0,0,w,hh)}cx.drawImage(im,0,0,w,hh);const dat=cv.toDataURL(tipo=="fondo"?"image/jpeg":"image/png",.88);msg("Guardando "+tipo+"…");const r=await api("/api/marca",{r:R,tipo,datos:dat});if(r.error)return msg("✖ "+r.error);C["_"+tipo]=Date.now();msg("✔ "+(tipo=="fondo"?"Fondo":"Logo")+" guardado. Pulsa «Crear vídeos y carta» para aplicarlo.");draw()}catch(e){msg("✖ "+e)}finally{URL.revokeObjectURL(url)}};im.src=url};msg("Elige la imagen…");f.click()}
async function iaFlyer(){msg("✨ La IA escribe el flyer…");const r=await api("/api/ia-flyer",{r:R});if(r.error)return msg("✖ "+r.error);C.flyer_titulo=r.titulo||C.flyer_titulo;C.flyer_sub=r.sub||C.flyer_sub;if(r.pie)C.flyer_pie=C.flyer_pie||r.pie;guardar();draw();msg("✔ Textos listos. Corrígelos si quieres.")}
async function promo(){msg("Creando QR, flyer, story y banner…");await api("/api/guardar",{r:R,carta:cl()});const r=await api("/api/promo",{r:R});if(r.error)return msg("✖ "+r.error);C._promo=Date.now();draw();msg("✔ Listo. Se ha abierto la carpeta «"+r.carpeta.split("/").pop()+"» en Descargas.")}
function cl(){const c={...C};for(const k of ["_logo","_fondo","_qr","_promo"])delete c[k];return c}
function add(){C.platos.push({id:uid(),nombre:"",categoria:"",precio:"",descripcion:"",alergenos:[],foto:""});guardar();draw();scrollTo(0,document.body.scrollHeight)}
function del(i){if(confirm("¿Quitar este plato?")){C.platos.splice(i,1);guardar();draw()}}
const ET=["Especialidad","Más vendido","Recomendación del chef","Nuevo","Vegetariano","Vegano","Sin gluten"];
function te(i,t){const p=C.platos[i];p.etiquetas=p.etiquetas||[];const k=p.etiquetas.indexOf(t);k<0?p.etiquetas.push(t):p.etiquetas.splice(k,1);guardar();draw()}
function mv(i,d){const j=i+d;if(j<0||j>=C.platos.length)return;[C.platos[i],C.platos[j]]=[C.platos[j],C.platos[i]];guardar();draw()}
function dup(i){const p=JSON.parse(JSON.stringify(C.platos[i]));p.id=uid();p.nombre+=" (copia)";p.video="";p.video_de="";C.platos.splice(i+1,0,p);guardar();draw()}
function tg(i,a){const p=C.platos[i];p.alergenos=p.alergenos||[];const k=p.alergenos.indexOf(a);k<0?p.alergenos.push(a):p.alergenos.splice(k,1);guardar();draw()}
function foto(i){const f=document.createElement("input");f.type="file";f.accept="image/*";f.onchange=()=>{const rd=new FileReader();rd.onload=async()=>{msg("Guardando foto…");const r=await api("/api/foto",{r:R,pid:C.platos[i].id,datos:rd.result});if(r.error)return msg("✖ "+r.error);C.platos[i].foto=r.foto;C.platos[i].fv=Date.now();guardar();draw();msg("Foto guardada. Pulsa ✨ para que la IA la describa.")};rd.readAsDataURL(f.files[0])};f.click()}
async function ia(i,campos){msg("✨ La IA está pensando…");await api("/api/guardar",{r:R,carta:C});const r=await api("/api/ia",{r:R,plato:C.platos[i],campos});if(r.error)return msg("✖ "+r.error);Object.assign(C.platos[i],r);guardar();draw();msg("✔ Listo. Revisa y corrige lo que quieras.")}
function msg(m){$("#msg").textContent=m}
async function generar(){await api("/api/guardar",{r:R,carta:C});const r=await api("/api/generar",{r:R});if(r.error)return msg(r.error);$("#gen").disabled=true;clearInterval(tim);tim=setInterval(async()=>{const s=await api("/api/estado");msg(s.msg);if(!s.trabajando){clearInterval(tim);$("#gen").disabled=false;cargar()}},1200)}
const cartel=async()=>{const r=await api("/api/ver",{r:R,que:"cartel"});if(r.error)msg(r.error)},abrir=()=>api("/api/abrir",{r:R}),ver=async()=>{const r=await api("/api/ver",{r:R});if(r.error)msg(r.error)};
init();
</script></body></html>
