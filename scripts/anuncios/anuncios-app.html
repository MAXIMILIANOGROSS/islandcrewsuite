<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anuncios · Island Crew</title>
<style>
:root{--ac:#ff6b4a;--ac2:#e0482a;--bg:#150c0b;--c:#211412;--t:#f7e9e4;--m:#c9a9a0;--ln:#ff6b4a55}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 Georgia,serif}
.ic{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:2px solid var(--ac);background:#00000040}.ic img{width:44px;height:44px;border-radius:50%;border:2px solid var(--ac);object-fit:cover}.ic b{letter-spacing:.14em;font-size:13px;color:var(--ac)}.ic span{color:var(--m);font-size:12px}.ic em{margin-left:auto;font-style:normal;color:var(--ac);font-weight:bold}
main{padding:20px 22px;max-width:1180px;margin:0 auto}h1{margin:0 0 4px;color:var(--ac);font-size:23px}.s{color:var(--m)}
.g{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:18px;margin-top:16px}@media(max-width:820px){.g{grid-template-columns:1fr}}
.p{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:16px}label{font-size:12px;color:var(--m);display:block;margin:10px 0 3px}
select,input,textarea{width:100%;background:#0f0807;color:var(--t);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font:inherit}
button{padding:10px 16px;border-radius:9px;border:1px solid var(--ac);background:#2a1310;color:var(--ac);font:inherit;cursor:pointer}button.p1{background:linear-gradient(var(--ac),var(--ac2));color:#1c0804;font-weight:bold}button:disabled{opacity:.5}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.v{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.v button.on{background:var(--ac);color:#1c0804}
#vista{background:#0f0807;border-radius:12px;padding:10px;text-align:center;min-height:300px}#vista img{max-width:100%;max-height:640px;border-radius:8px}
#msg{min-height:22px;margin:10px 0}.ok{color:#8fd694}.er{color:#ff9a8a}.ck{display:flex;gap:8px;align-items:center;margin-top:12px}.ck input{width:auto}
</style></head><body>
<div class="ic"><img src="__AV_anuncios__"><b>ISLAND CREW</b><span>Marketing Suite</span><em>Anuncios</em></div>
<main><h1>Fábrica de anuncios</h1><div class="s">Elige un plato de tu carta y crea tu publicidad en todos los formatos. Los precios y ofertas los pones tú.</div>
<div class="g"><div class="p">
<label>Restaurante</label><select id="r"></select>
<label>Plato</label><select id="plato"></select>
<label>Estilo</label><select id="estilo"></select>
<label>Titular</label><input id="titular" maxlength="60">
<label>Subtítulo (aquí puedes poner tu oferta o precio)</label><textarea id="subtitulo" rows="2" maxlength="120"></textarea>
<label>Llamada a la acción</label><input id="cta" maxlength="24" placeholder="Reserva ya">
<label>Teléfono o web (opcional)</label><input id="contacto" maxlength="40">
<div class="ck"><input type="checkbox" id="video" checked><label style="margin:0">Crear también un vídeo vertical de 8 segundos</label></div>
<div class="f"><button id="ia">✨ Escribir con IA</button><button class="p1" id="gen">Guardar en Descargas</button></div>
</div><div><div class="v" id="fm"></div><div id="vista"></div></div></div><div id="msg"></div></main>
<script>
var T="__TOKEN__",E=__ESTILOS__,F=[["feed","Feed 4:5"],["story","Story 9:16"],["cuadrado","Cuadrado"],["pantalla","Pantalla horizontal"]],fm="feed",$=function(x){return document.getElementById(x)};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function api(u,b){return fetch(u,b?{method:"POST",headers:{"content-type":"application/json","x-cv":T},body:JSON.stringify(b)}:{headers:{"x-cv":T}}).then(function(r){return r.json()})}
function m(t,c){$("msg").className=c||"";$("msg").textContent=t}
function cfg(){return{r:$("r").value,plato:$("plato").value,estilo:$("estilo").value,titular:$("titular").value,subtitulo:$("subtitulo").value,cta:$("cta").value,contacto:$("contacto").value,video:$("video").checked}}
var tm=null;function ver(){clearTimeout(tm);tm=setTimeout(function(){var c=cfg();if(!c.plato){$("vista").innerHTML='<p class="s">Primero crea tu carta con platos y fotos en Carta Viva.</p>';return}
var q="r="+encodeURIComponent(c.r)+"&plato="+encodeURIComponent(c.plato)+"&estilo="+c.estilo+"&titular="+encodeURIComponent(c.titular)+"&subtitulo="+encodeURIComponent(c.subtitulo)+"&cta="+encodeURIComponent(c.cta)+"&contacto="+encodeURIComponent(c.contacto)+"&f="+fm+"&t="+T+"&_="+Date.now();$("vista").innerHTML='<img src="/img?'+q+'">'},250)}
$("fm").innerHTML=F.map(function(f){return '<button data-f="'+f[0]+'"'+(f[0]==fm?' class="on"':"")+'>'+f[1]+'</button>'}).join("");
$("fm").onclick=function(e){var f=e.target.getAttribute("data-f");if(!f)return;fm=f;[].forEach.call($("fm").children,function(b){b.className=b.getAttribute("data-f")==f?"on":""});ver()};
$("estilo").innerHTML=Object.keys(E).map(function(k){return '<option value="'+k+'">'+esc(E[k])+'</option>'}).join("");
function carga(r){api("/api/estado?r="+encodeURIComponent(r||"")).then(function(e){$("r").innerHTML=e.restaurantes.map(function(x){return '<option'+(x==e.r?" selected":"")+'>'+esc(x)+'</option>'}).join("");$("plato").innerHTML=e.platos.map(function(p){return '<option value="'+p.id+'">'+esc(p.nombre)+'</option>'}).join("");if(e.platos.length){$("titular").value=e.platos[0].nombre}ver()})}
$("r").onchange=function(){carga($("r").value)};$("plato").onchange=function(){var o=$("plato").selectedOptions[0];$("titular").value=o?o.textContent:"";ver()};
["estilo","titular","subtitulo","cta","contacto"].forEach(function(i){$(i).oninput=ver});
$("ia").onclick=function(){$("ia").disabled=true;m("Escribiendo el anuncio…");api("/api/sugerir",cfg()).then(function(x){$("ia").disabled=false;if(x.ok===false){m(x.error,"er");return}$("titular").value=x.titular||$("titular").value;$("subtitulo").value=x.subtitulo||"";$("cta").value=x.cta||"";m(x.ia?"Texto listo. Revísalo y añade tu oferta si quieres.":"Texto básico porque: "+x.aviso,x.ia?"ok":"er");ver()})};
$("gen").onclick=function(){$("gen").disabled=true;m("Creando el anuncio"+($("video").checked?" y el vídeo…":"…"));api("/api/guardar",cfg()).then(function(x){$("gen").disabled=false;m(x.ok?"Listo. Se ha abierto la carpeta en Descargas.":x.error,x.ok?"ok":"er")})};
carga("");
</script></body></html>
